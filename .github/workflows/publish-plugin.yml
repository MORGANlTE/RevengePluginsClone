name: Build and deploy plugin to GitHub Pages (gh-pages)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'src/plugins/**'
      - 'package.json'
      - 'package-lock.json'
      - 'yarn.lock'
      - '.github/workflows/**'

permissions:
  contents: write   # needed so the action can push the gh-pages branch

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; elif [ -f yarn.lock ]; then yarn --frozen-lockfile; else npm install; fi

      - name: Build (if script exists)
        run: |
          if npm run | grep -q " build"; then npm run build; else echo "No build script defined; skipping build step"; fi

      - name: Prepare public directory
        run: |
          rm -rf public || true
          mkdir -p public
          if [ -d dist ]; then cp -a dist/. public/; fi
          if [ -d build ]; then cp -a build/. public/; fi
          if [ -d src/plugins ]; then cp -a src/plugins/. public/plugins/; fi

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          # Optionally set keep_files: true so other files on gh-pages are preserved:
          # keep_files: true
